# Chennai Zone Registry
# Covers 25 residential/commercial areas and 10 major road corridors.
# lat/lon are centroids for area zones and representative anchor points for corridors.
# radius_km is the influence radius used by the context aggregator to assign
# a delivery coordinate to its nearest zone.
#
# Area zone types:
#   residential  – primarily housing, apartments
#   commercial   – shopping, offices, mixed-use
#   industrial   – factories, warehouses, logistics hubs
#   coastal      – near-sea areas with distinct weather patterns
#
# Corridor zone types:
#   highway      – express highways and arterial roads
#   urban_road   – major city roads with traffic signals


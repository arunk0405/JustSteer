corridors:
  # Each corridor is defined by an ordered list of waypoints (lat, lon).
  # The aggregator uses these to compute travel-time index via TomTom.
  # waypoints should cover the full length at ~2–3 km intervals.

  - name: GST Road
    code: CHN_GST
    type: highway
    description: "Grand Southern Trunk Road — Chennai to Tambaram and beyond"
    waypoints:
      - [12.9716, 80.1943]   # Guindy / CMBT junction
      - [12.9620, 80.1837]   # St. Thomas Mount
      - [12.9516, 80.1462]   # Chromepet
      - [12.9400, 80.1250]   # Pallavaram
      - [12.9249, 80.1000]   # Tambaram
    typical_freeflow_kmph: 55
    tags: [airport_access, industrial_freight, peak_congestion]

  - name: Outer Ring Road
    code: CHN_ORR
    type: highway
    description: "ORR — connects western and southern suburbs in a loop"
    waypoints:
      - [13.0474, 80.1162]   # Poonamallee
      - [13.0358, 80.1567]   # Porur
      - [13.0100, 80.1850]   # Maduravoyal junction
      - [12.9815, 80.2180]   # Velachery / Medavakkam
      - [12.9383, 80.2132]   # Pallikaranai
    typical_freeflow_kmph: 65
    tags: [bypass_route, heavy_vehicles, night_freight]

  - name: Anna Salai (Mount Road)
    code: CHN_ANNASALAI
    type: urban_road
    description: "Main spine of Chennai — Chepauk to Guindy"
